<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script defer src="./rps4.js"></script> 
    <style>
            body{
                background-color: black;
                color: yellow;
                font-family: arial;
            }

            .move-button{
                height: 100px;
                width: 100px;
                border: 2px solid yellow;
                border-radius: 50px;
                background-color: transparent;
                cursor: pointer;
            }

            .move-image{
                height: 70px;
            }

            .small-move-image{
                height: 35px;
            }

            .play-area{
                border: 2px solid yellow;
                display: flex;
                justify-content: space-around;
                padding: 20px;
                text-align: center;
            }
            .stats{
                display: block;
            }
    </style>
   </head>

<body>
    <div class="play-area">
    <button class="move-button" id="rock-button">
        <img class="move-image" src="./images/rock-emoji.png" />
    </button>
    <button class="move-button" id="paper-button">
         <img class="move-image" src="./images/paper-emoji.png" />
    </button>
    <button class="move-button" id="scissors-button">
        <img class="move-image" src="./images/scissors-emoji.png" />
    </button>
    <button class="move-button" id="refresh-button">
        <img class="move-image" src="./images/refresh-emoji.png" />
    </button>
    <div class="stats">
    <p id="moves"></p>
    <p id="results"></p>
    <p id="scores"></p>
    </div>
    <button id="autoplay-button">Autoplay</button>
    </div>
</body>

</html>
